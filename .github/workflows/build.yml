name: Build and Test Gem

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        jruby-version: ["9.4", "10.0"]
        java-version: ["21"]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: "temurin"
          java-version: ${{ matrix.java-version }}

      - name: Set up JRuby
        uses: ruby/setup-ruby@a30dfa457ad68707b8b910ac3a244714b61c0626 # v1.320.0
        with:
          ruby-version: jruby-${{ matrix.jruby-version }}
          bundler-cache: true

      - name: Install dependencies
        run: |
          bundle install
          ./gradlew clean vendor

      - name: Build gem
        run: gem build logstash-integration-aws.gemspec
